name: Publish to Both Registries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_to_npm:
        description: Publish to npmjs.org (leave unchecked for GitHub Packages retries)
        required: false
        type: boolean
        default: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org" # Default to public npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      # --- 1. PUBLISH TO PUBLIC NPM ---
      - name: Publish to Public NPM
        if: github.event_name == 'release' || inputs.publish_to_npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set up GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://npm.pkg.github.com"
          scope: "@omid-gharavi"

      - name: Publish to GitHub Packages
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
